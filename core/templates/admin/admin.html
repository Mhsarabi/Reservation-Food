{%load static%}
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>رزرو غذا | الوان |مدیریت</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="{%static 'css/index.css'%}">
    <link rel="stylesheet" href="{%static 'css/calendar.css'%}">
    <link rel="stylesheet" href="{%static 'css/admin.css'%}">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css">

</head>

<body>

<!-- ================= Header ================= -->

{% include 'includes/admin_header.html' %}
{% include 'includes/admin_modals.html' %}


<!-- ================= Main ================= -->

<div class="container-fluid mt-4">

    <div class="row">

        <!-- Calendar -->

        <div class="col-lg-8">

            <div class="calendar-container">

                <div class="calendar-header">

                    <button id="prevMonth" class="month-btn">
                        ❮
                    </button>

                    <h3 id="monthYear"></h3>

                    <button id="nextMonth" class="month-btn">
                        ❯
                    </button>

                </div>

                <div id="weekdays" class="weekdays"></div>

                <div id="calendarGrid" class="calendar-grid"></div>

            </div>

        </div>

        <!-- Right Side -->

        <div class="col-lg-4">

            <div class="food-card">

                <h4>
                    انتخاب غذا
                </h4>

                <select
                    id="foodSelect"
                    class="form-select">

                    <option value="">

                    </option>
                </select>
                <hr>
                <h4>
                    مدیریت غذای روز
                </h4>

                <p id="selectedDate">
                    تاریخی انتخاب نشده است.
                </p>

                <div class="row g-2 mt-3">

                    <div class="col-6">

                        <button
                            id="saveFood"
                            class="btn btn-success w-100">

                            ذخیره غذای روز

                        </button>

                    </div>

                    <div class="col-6">

                        <button
                            id="deleteFood"
                            class="btn btn-danger w-100">

                            حذف غذای روز

                        </button>

                    </div>

                </div>

                <hr>

                    <h4>
                    مدیریت غذای هفته
                   </h4>

                    <div class="row g-2 mb-3">

                        <div class="col-6">

                            <label class="form-label">
                                از تاریخ
                            </label>

                            <input
                                id="fromDate"
                                class="form-control"
                                type="text"
                                autocomplete="off">

                        </div>

                        <div class="col-6">

                            <label class="form-label">
                                تا تاریخ
                            </label>

                            <input
                                id="toDate"
                                class="form-control"
                                type="text"
                                autocomplete="off">

                        </div>

                    </div>

                    <div id="weekDays" class="week-grid">

                    <label class="week-card">
                        <input class="form-check-input" type="checkbox" value="0">
                        <span>شنبه</span>
                    </label>

                    <label class="week-card">
                        <input class="form-check-input" type="checkbox" value="1">
                        <span>یکشنبه</span>
                    </label>

                    <label class="week-card">
                        <input class="form-check-input" type="checkbox" value="2">
                        <span>دوشنبه</span>
                    </label>

                    <label class="week-card">
                        <input class="form-check-input" type="checkbox" value="3">
                        <span>سه شنبه</span>
                    </label>

                    <label class="week-card">
                        <input class="form-check-input" type="checkbox" value="4">
                        <span>چهارشنبه</span>
                    </label>

                    <label class="week-card">
                        <input class="form-check-input" type="checkbox" value="5">
                        <span>پنج شنبه</span>
                    </label>

                </div>

                <div class="d-grid mt-3">

                    <button
                        id="saveWeekly"
                        class="btn btn-primary">

                        <i class="bi bi-calendar-week"></i>
                        ثبت برنامه 

                    </button>

                </div>

            </div>

        </div>
        

    </div>

</div>

<!-- ================= Scripts ================= -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jalaali-js/dist/jalaali.min.js"></script>

<script src="{%static 'js/calendar.js'%}"></script>
<script src="{%static 'js/ui.js'%}"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/persian-date@1.1.0/dist/persian-date.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>
<script>let menuData = {};</script>
<script src="{% static 'js/admin_toolBar.js' %}"></script>
<script src="{%static 'js/weekly-program.js'%}"></script>
<script src="{%static 'js/admin.js'%}"></script>


</body>

</html>
