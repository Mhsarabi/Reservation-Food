{%load static%}
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>رزرو غذا | الوان</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="{%static 'css/index.css'%}">
    <link rel="stylesheet" href="{%static 'css/calendar.css'%}">


</head>

<body>

<!-- ================= Header ================= -->

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

    <div class="container-fluid px-4">

        <a href="#" class="navbar-brand fw-bold text-success fs-4">
             <img src="{%static 'images/logo.png'%}" class="navbar-logo" alt="Alvan Logo">

            Alvan|سامانه رزرو غذا

        </a>

        <div class="d-flex align-items-center gap-4">

            <span id="todayDate"></span>

            <div class="dropdown">

    <button
        class="btn btn-light dropdown-toggle"
        type="button"
        id="userMenu"
        data-bs-toggle="dropdown"
        aria-expanded="false">

        <i class="bi bi-person-circle"></i>
        محسن سرابی

    </button>

    <ul class="dropdown-menu dropdown-menu-end">

        <li>

            <a
                class="dropdown-item"
                href="#"
                id="changePassword">

                <i class="bi bi-key"></i>
                تغییر رمز عبور

            </a>

        </li>

        <li><hr class="dropdown-divider"></li>

        <li>

            <a
                class="dropdown-item text-danger"
                href="{%url 'accounts:logout'%}">

                <i class="bi bi-box-arrow-right"></i>
                خروج

            </a>

        </li>

    </ul>

 </div>

</nav>

<!-- ================= Main ================= -->

<div class="container-fluid mt-4">

    <!-- <div class="row">-->

        <!-- Calendar -->
            <div class="row mt-4">

            <!-- Calendar -->

            <div class="col-lg-8">

                <div class="calendar-container">

                    <div class="calendar-header">

                        <button id="prevMonth" class="month-btn">

                            ❮

                        </button>

                        <h3 id="monthYear"></h3>

                        <button id="nextMonth" class="month-btn">

                            ❯

                        </button>

                    </div>
                    <h6 class="calendar-note">برای رزرو غذا، روی روزهای موردنظر کلیک کنید.</h6>

                    <div id="weekdays" class="weekdays"></div>

                    <div id="calendarGrid" class="calendar-grid">


                    </div>

                </div>

            </div>

<!-- Food Info -->         

<div class="col-lg-4" >
    <div class="food-card user-food-card">
                <div class="calendar-tools mb-4">

     <button id="reserveMonthBtn"
            class="btn btn-primary w-100">
        <i class="bi bi-calendar-check"></i>
        رزرو همه روزها
     </button>

     <button id="cancelMonthBtn"
            class="btn btn-outline-danger w-100">
        <i class="bi bi-calendar-x"></i>
        لغو همه روزها
     </button>
 </div>

        <h4>
            اطلاعات روز
        </h4>

        <hr>

        <p id="selectedDate">
            تاریخی انتخاب نشده است.
        </p>

        <!-- تصویر غذا -->
        <div class="food-image">

                <img
                    id="foodImage"
                    src="../static/images/no-food.png"
                    alt="">

            </div>

            <p class="mt-3">

            </p>

            <p id="foodName">
                -
            </p>

            <hr>

                <p id="reservedCount">
                    تعداد غذاهای رزرو شده این ماه: 0
                </p>

        </div>

    </div>

</div>


<div class="modal fade"
     id="passwordModal"
     tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    تغییر رمز عبور

                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">
                <div id="passwordMessage" class="alert d-none mb-3"></div>

                <div class="mb-3">

                    <label class="form-label">
                        رمز فعلی
                    </label>

                    <input
                        type="password"
                        id="oldPassword"
                        class="form-control">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        رمز جدید
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        class="form-control">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        تکرار رمز جدید
                    </label>

                    <input
                        type="password"
                        id="repeatPassword"
                        class="form-control">

                </div>

            </div>
            <input
                type="hidden"
                id="csrf-token"
                value="{{ csrf_token }}">

            <div class="modal-footer">

                <button
                    class="btn btn-success"
                    id="savePassword">

                    ذخیره

                </button>

            </div>

        </div>

    </div>

</div>


<!-- ================= Scripts ================= -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jalaali-js/dist/jalaali.min.js"></script>
<script src="{%static 'js/menu-data.js'%}"></script>
<script src="{%static 'js/calendar.js'%}"></script>
<script src="{%static 'js/ui.js'%}"></script>
<script src="{%static 'js/reservation.js'%}"></script>



</body>

</html>
