{% load static %}
<!-- ============================================================ -->
<!-- MODALS مشترک                                                 -->
<!-- ============================================================ -->

<!-- ================== 1. تغییر رمز عبور ================== -->
<div class="modal fade" id="passwordModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">تغییر رمز عبور</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="passwordMessage" class="alert d-none mb-3"></div>
                <div class="mb-3">
                    <label class="form-label">رمز فعلی</label>
                    <input type="password" id="oldPassword" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">رمز جدید</label>
                    <input type="password" id="newPassword" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">تکرار رمز جدید</label>
                    <input type="password" id="repeatPassword" class="form-control">
                </div>
            </div>
            <input type="hidden" id="csrf-token" value="{{ csrf_token }}">
            <div class="modal-footer">
                <button type="button" id="savePassword" class="btn btn-success">ذخیره</button>
            </div>
        </div>
    </div>
</div>

<!-- ================== 2. تعریف غذای جدید ================== -->
<div class="modal fade" id="foodModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">مدیریت غذاها</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="foodMessage" class="alert d-none"></div>
                <div class="row align-items-start">
                    <div class="col-md-7">
                        <div class="mb-3">
                            <label class="form-label">نام غذا</label>
                            <input id="foodNameInput" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">تصویر غذا</label>
                            <input type="file" id="foodImageInput" class="form-control" accept="image/*">
                        </div>
                    </div>
                    <div class="col-md-5 text-center">
                        <img id="foodPreview" class="food-preview">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" id="saveNewFood" class="btn btn-primary">ثبت غذا</button>
            </div>
        </div>
    </div>
</div>

<!-- ================== 3. گزارش گیری ================== -->
<div class="modal fade" id="reportModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">گزارش گیری</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <ul class="nav nav-tabs mb-3" id="reportTabs" role="tablist">
                    <li class="nav-item">
                        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#monthlyTab">گزارش ماهانه</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#rangeTab">گزارش بازه زمانی</button>
                    </li>
                </ul>
                <div class="tab-content">
                    <div class="tab-pane fade show active" id="monthlyTab">
                        <div class="mb-3">
                            <label class="form-label">سال</label>
                            <input id="reportYear" class="form-control" type="number" value="1405">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">ماه</label>
                            <select id="reportMonth" class="form-select">
                                <option value="">انتخاب کنید</option>
                                <option value="1">فروردین</option>
                                <option value="2">اردیبهشت</option>
                                <option value="3">خرداد</option>
                                <option value="4">تیر</option>
                                <option value="5">مرداد</option>
                                <option value="6">شهریور</option>
                                <option value="7">مهر</option>
                                <option value="8">آبان</option>
                                <option value="9">آذر</option>
                                <option value="10">دی</option>
                                <option value="11">بهمن</option>
                                <option value="12">اسفند</option>
                            </select>
                        </div>
                        <button type="button" id="generateMonthlyReport" class="btn btn-primary w-100">دریافت گزارش ماهانه</button>
                    </div>
                    <div class="tab-pane fade" id="rangeTab">
                        <div class="mb-3">
                            <label class="form-label">از تاریخ</label>
                            <input id="reportFromDate" class="form-control" type="text" autocomplete="off">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">تا تاریخ</label>
                            <input id="reportToDate" class="form-control" type="text" autocomplete="off">
                        </div>
                        <button type="button" id="generateRangeReport" class="btn btn-success w-100">دریافت گزارش بازه زمانی</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ================== 4. ویرایش غذا ================== -->
<div class="modal fade" id="editFoodModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">ویرایش غذا</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-7">
                        <div class="mb-3">
                            <label class="form-label">انتخاب غذا</label>
                            <select id="editFoodSelect" class="form-select"></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">نام غذا</label>
                            <input id="editFoodName" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">تصویر جدید</label>
                            <input type="file" id="editFoodImage" class="form-control" accept="image/*">
                        </div>
                    </div>
                    <div class="col-md-5 text-center">
                        <img id="editFoodPreview" src="{% static 'images/no-food.png' %}" class="food-preview">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" id="saveFoodChanges" class="btn btn-success">ذخیره تغییرات</button>
            </div>
        </div>
    </div>
</div>
