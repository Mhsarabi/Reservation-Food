{%load static%}
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الوان | سامانه رزرو غذا</title>

    <link rel="stylesheet" href="{% static 'css/bootstrap.rtl.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap-icons.min.css' %}">

    <link rel="stylesheet" href="{%static 'css/Authentication.css'%}">
</head>

<body>

<div class="login-card">

    <div class="text-center">
        <img src="{%static 'images/logo.png'%}" class="navbar-logo" alt="Alvan Logo">

        <h2>Alvan</h2>

        <p class="subtitle">
            سامانه رزرو غذا
        </p>

    </div>

    <div class="tabs">

        <button class="tab active" id="loginTab">
            ورود
        </button>

    </div>

    <!-- فرم ورود -->
    

    <form id="loginForm" method="post">
        {% csrf_token %}
        {%if messages%}
           {%for message in messages%}
              <div class="alert alert-danger">
                {{message}}
              </div>
            {%endfor%}
        {%endif%}

        <div class="mb-3">

            <label class="form-label">
                کد ملی
            </label>

            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-person"></i>

                </span>

                <input
                        type="text"
                        name="national_code"
                        class="form-control"
                        placeholder="لطفا کد ملی خود را وارد نمایید"
                        required>

            </div>

        </div>

        <div class="mb-4">

            <label class="form-label">
                رمز عبور
            </label>

            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-lock"></i>

                </span>

                <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="لطفا رمز عبور خود را وارد نمایید"
                        autocomplete="current-password"
                        required>

            </div>

        </div>

        <button type="submit" class="btn btn-success w-100">
            ورود
        </button>

    </form>
</div>

<script src="{%static 'js/Authentication.js'%}"></script>

</body>

</html>
