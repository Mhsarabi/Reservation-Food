version: "3.9"

services:

  db:
    image: postgres:15-alpine
    container_name: db

    volumes:
      - ./postgres/data:/var/lib/postgresql/data

    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    restart: always

  backend:
    container_name: backend

    build:
      context: .
      dockerfile: ./dockerfiles/prod/django/Dockerfile

    environment:
      DEBUG: "False"

    env_file:
      - ./envs/dev/django/.env

    ports:
      - "80:80"

    restart: always

    depends_on:
      - db